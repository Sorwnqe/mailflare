name: Nightly Mailflare update

on:
  schedule:
    # 16:00 UTC is 00:00 the following day in Asia/Shanghai.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate synchronization without pushing or deploying'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mailflare-upstream-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check repository deploy key
        env:
          SYNC_SSH_KEY: ${{ secrets.MAILFLARE_SYNC_SSH_KEY }}
        run: test -n "$SYNC_SSH_KEY"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          ssh-key: ${{ secrets.MAILFLARE_SYNC_SSH_KEY }}

      - name: Merge upstream while retaining installation changes
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mailflare-update'
          git config user.email 'mailflare-update@users.noreply.github.com'
          git remote add upstream https://github.com/hieunc229/mailflare.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A conflict stops this job. Never replace the installation tree.
          if ! git merge --no-commit --no-ff upstream/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                package.json|package-lock.json|src/lib/backups/export.ts|src/lib/backups/table-groups.ts|src/lib/backups/types.d.ts) ;;
                *) echo "::error::Manual review required for $file"; exit 1 ;;
              esac
            done
            for file in "${conflicts[@]}"; do
              git restore --source=upstream/main --staged --worktree -- "$file"
            done
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.upstream.outputs.changed == 'true'
        with:
          node-version: '24'

      - name: Install and validate candidate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          node scripts/ensure-security-floor.mjs
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --audit-level=critical
          npm ci
          npm audit --audit-level=critical
          npm run build
          node --test tests/backup-table-list.test.mjs tests/push-devices-migration.test.mjs
          git add package.json package-lock.json

      - name: Publish tested update to trigger Cloudflare Builds
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run != true
        env:
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git diff --check
          git commit -m 'Update Mailflare from upstream (nightly)'
          git push origin "HEAD:${DEPLOY_BRANCH}"
