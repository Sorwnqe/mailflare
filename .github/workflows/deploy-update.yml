name: Nightly Mailflare update

on:
  schedule:
    # 16:00 UTC is 00:00 the following day in Asia/Shanghai.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailflare-upstream-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check repository token
        env:
          UPDATE_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
        run: test -n "$UPDATE_TOKEN"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}

      - name: Merge upstream while retaining installation changes
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mailflare-update'
          git config user.email 'mailflare-update@users.noreply.github.com'
          git remote add upstream https://github.com/hieunc229/mailflare.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A conflict stops this job. Never replace the installation tree.
          git merge --no-commit --no-ff upstream/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.upstream.outputs.changed == 'true'
        with:
          node-version: '24'

      - name: Install and validate candidate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          npm ci
          npm audit --audit-level=critical
          npm run build

      - name: Publish tested update to trigger Cloudflare Builds
        if: steps.upstream.outputs.changed == 'true'
        env:
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git diff --check
          git commit -m 'Update Mailflare from upstream (nightly)'
          git push origin "HEAD:${DEPLOY_BRANCH}"
